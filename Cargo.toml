[workspace]
resolver = "2"
members = ["app", "server", "shared"]

[workspace.dependencies]
dioxus = "0.6.2"

app = { path = "app" }
server = { path = "server" }
shared = { path = "shared" }


[profile.wasm-dev]
inherits = "dev"
opt-level = 0

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
