[package]
name = "dioxus-todo-fullstack"
version = "0.2.0"
authors = ["Yu Chen <rabbit19981023@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.6.2", features = ["fullstack", "router", "logger"] }
serde = { version = "1.0.210", features = ["derive"] }

tokio = { version = "1.40.0", features = ["full"], optional = true }
sqlx = { version = "0.8.2", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
], optional = true }

[features]
default = []
server = ["dioxus/server", "tokio", "sqlx"]
web = ["dioxus/web"]

[profile.wasm-dev]
inherits = "dev"
opt-level = 0

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
