[workspace]
resolver = "3"
members = ["web", "api", "shared"]

[workspace.dependencies]
dioxus = { version = "0.7.1", default-features = false }

api = { path = "api" }
shared = { path = "shared" }


[profile.wasm-dev]
inherits = "dev"
opt-level = 0

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
